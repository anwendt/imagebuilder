# Example only. Do not commit real credentials to Git.
apiVersion: v1
kind: Secret
metadata:
  name: openstack-credentials
  namespace: imagebuilder-system
type: Opaque
stringData:
  credentials: |
    {
      "username": "<openstack-user>",
      "password": "<openstack-password>",
      "projectName": "<project-name>",
      "domainName": "Default",
      "remotePrivateKey": "<private-key-for-remote-keypair>"
    }
