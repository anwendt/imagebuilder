# Example only. Do not commit real credentials to Git.
# Prefer IRSA/OIDC where possible, or use External Secrets, Sealed Secrets, or SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: imagebuilder-system
type: Opaque
stringData:
  credentials: |
    {
      "accessKeyId": "<aws-access-key-id>",
      "secretAccessKey": "<aws-secret-access-key>"
    }
