apiVersion: imagebuilder.io/v1alpha1
kind: ProviderConfig
metadata:
  name: aws-tomcat
  namespace: imagebuilder-system
  labels:
    app.kubernetes.io/name: imagebuilder-aws-tomcat
    app.kubernetes.io/part-of: imagebuilder
spec:
  provider: aws
  credentials:
    secretRef:
      name: aws-credentials
      key: credentials
  region: eu-west-1
  extra:
    # httpProxy: http://proxy.example.com:8080
    # httpsProxy: http://proxy.example.com:8443
    # noProxy: localhost,127.0.0.1,.svc,.cluster.local,169.254.169.254
    roleArn: arn:aws:iam::123456789012:role/ImageBuilderProviderRole
    remote.instanceType: t3.small
    remote.subnetId: subnet-0123456789abcdef0
    remote.securityGroupIds: sg-0123456789abcdef0
    remote.iamInstanceProfile: ImageBuilderInstanceProfile
    remote.kmsKeyId: alias/imagebuilder
    remote.rootVolumeSizeGiB: "32"
