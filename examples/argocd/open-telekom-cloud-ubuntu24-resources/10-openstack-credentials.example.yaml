# Example only. Do not commit real credentials to Git.
# Prefer application credentials, External Secrets, Sealed Secrets, or SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: otc-credentials
  namespace: imagebuilder-system
type: Opaque
stringData:
  credentials: |
    {
      "username": "<otc-user>",
      "password": "<otc-password>",
      "projectName": "<otc-project-name>",
      "domainName": "<otc-domain-name>",
      "remotePrivateKey": "<private-key-for-remote-keypair>"
    }
