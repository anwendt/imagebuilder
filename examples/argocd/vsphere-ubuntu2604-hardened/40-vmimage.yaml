apiVersion: imagebuilder.io/v1alpha1
kind: VMImage
metadata:
  name: ubuntu-2604-vsphere-v1-0-0
  namespace: imagebuilder-system
  labels:
    imagebuilder.io/platform: vsphere
spec:
  os:
    family: linux
    distribution: ubuntu
    version: "26.04"
    arch: amd64
  source:
    type: cloud-image
    # Canonical release-20261016; SHA256SUMS verified against the Ubuntu cloud
    # image signing key.
    url: https://cloud-images.ubuntu.com/releases/resolute/release-20261016/ubuntu-26.04-server-cloudimg-amd64.ova
    checksum: sha256:fb52eeb79c0e71bce675729a7d67f5a0c6691deea04d2b13a524c7e376d74ec1
  provisioners:
    - type: shell
      inline: |
        #!/bin/sh
        # Short GRUB timeout. GRUB drop-ins in /etc/default/grub.d override the cloud image's own
        # settings reliably; editing /etc/default/grub alone would be overridden by
        # 50-cloudimg-settings.cfg.
        set -eu
        echo "change grub configuration"
        install -d -m 0755 /etc/default/grub.d
        cat > /etc/default/grub.d/99-imagebuilder.cfg <<'GRUBEOF'
        GRUB_TIMEOUT=1
        GRUB_RECORDFAIL_TIMEOUT=0
        GRUBEOF
        update-grub
    - type: shell
      inline: |
        #!/bin/sh
        # Optional apt proxy.  is substituted by generate.py; an empty value
        # configures nothing. The proxy stays in the template when set.
        set -eu
        PROXY=""
        if [ -z "${PROXY}" ]; then
          echo "no apt proxy configured"
          exit 0
        fi
        echo "configuring apt proxy ${PROXY}"
        cat > /etc/apt/apt.conf.d/proxy.conf <<APTEOF
        Acquire::http::Proxy "${PROXY}";
        Acquire::https::Proxy "${PROXY}";
        APTEOF
        cat /etc/apt/apt.conf.d/proxy.conf
    - type: shell
      inline: |
        #!/bin/sh
        # cloud-init datasources for vSphere. Cloud images ship no installer
        # artifacts; their removal is kept for safety.
        set -eu
        echo "configuration of cloud-init"
        rm -f /etc/cloud/cloud.cfg.d/99-installer.cfg
        rm -f /etc/cloud/cloud.cfg.d/subiquity-disable-cloudinit-networking.cfg
        echo "datasource_list: [ OVF, VMware, None ]" > /etc/cloud/cloud.cfg.d/90_dpkg.cfg
    - type: shell
      inline: |
        #!/bin/sh
        # Apply all pending package updates.
        # open-vm-tools is held during the upgrade: its restart would kill the guest
        # process that VMware Guest Operations runs this script in. It is not upgraded
        # here (the next regular update takes it).
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        dpkg --configure -a
        if dpkg -s open-vm-tools >/dev/null 2>&1; then
          apt-mark hold open-vm-tools
        fi
        echo "Updating system with the latest patches..."
        apt-get update -y
        apt-get upgrade -y -o Dpkg::Options::=--force-confold
        apt-get full-upgrade -y -o Dpkg::Options::=--force-confold
        apt-get autoremove -y
        apt-mark unhold open-vm-tools || true
        echo "System update and upgrade completed successfully."
    - type: shell
      inline: |
        #!/bin/sh
        # ansible-core comes from the Ubuntu archive (only ansible.builtin modules
        # are used by the role).
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -y
        apt-get install -y --no-install-recommends ansible-core python3-apt
        ansible --version | head -n 1
    - type: shell
      inline: |
        #!/bin/sh
        # Baseline packages. Packages that do not exist on the release are reported
        # and skipped. --no-upgrade keeps already installed packages (open-vm-tools)
        # from being restarted while this script runs through Guest Operations.
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        echo "Install addon components"
        for pkg in unzip ca-certificates bash-completion open-vm-tools ufw wireguard \
                   apparmor apparmor-utils apparmor-profiles apparmor-profiles-extra \
                   net-tools cloud-guest-utils cloud-image-utils open-iscsi auditd acct; do
          if apt-cache show "$pkg" >/dev/null 2>&1; then
            apt-get install -y --no-upgrade "$pkg"
          else
            echo "SKIP: package $pkg is not available on this release"
          fi
        done
    - type: shell
      inline: |
        #!/bin/sh
        # Enforce all AppArmor profiles. Runs after the addon step because aa-enforce
        # comes from apparmor-utils. Only profile files are enforced, in one call.
        set -u
        echo "Configure apparmor"
        find /etc/apparmor.d -maxdepth 1 -type f -print0 | xargs -0 aa-enforce \
          || echo "WARN: aa-enforce reported problems for some profiles"
        aa-status --enabled && echo "apparmor enabled" || echo "WARN: apparmor is not enabled in the running kernel"
        exit 0
    - type: shell
      inline: |
        #!/bin/sh
        # Runs the baseline hardening role (ansible/roles/system) locally.
        # Generated by generate.py from ansible/; do not edit.
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        WORK=/opt/imagebuilder/ansible
        install -d -m 0755 "$WORK/roles/system/tasks" "$WORK/roles/system/defaults" "$WORK/roles/system/templates"
        cat > "$WORK/local.yml" <<'IMAGEBUILDER_ROLE_EOF'
        ---
        # Local playbook for the baseline hardening role.
        - name: Hardening of the Ubuntu 26.04 golden image
          hosts: localhost
          connection: local
          become: false
          gather_facts: true
          roles:
            - system
        IMAGEBUILDER_ROLE_EOF
        cat > "$WORK/roles/system/defaults/main.yml" <<'IMAGEBUILDER_ROLE_EOF'
        ---
        # Defaults of the baseline hardening role for Ubuntu 26.04.

        kernel_hardening_conf:
          - cramfs
          - freevxfs
          - jffs2
          - hfs
          - hfsplus
          # squashfs, fat and vfat are NOT disabled on Ubuntu: snapd needs squashfs and
          # the cloud image mounts its EFI system partition (vfat) from fstab; blocking
          # them makes the image fail to boot to a normal target.
          - udf
          - cifs
          - nfs
          - nfsv3
          - nfsv4
          - gfs2
          - usb-storage
          - bnep
          - bluetooth
          - btusb
          - net-pf-31
          - appletalk
          - dccp
          - sctp
          - rds
          - tipc

        limits_conf: []

        # adm is kept: on Ubuntu it is the group that owns /var/log files.
        removal_of_users:
          - games
          - lp

        removal_of_groups:
          - games

        # Packages with a network-facing attack surface. parted (cloud-init disk
        # growing tooling) and linux-firmware (kernel metapackages) are kept.
        removal_of_packages:
          - xinetd
          - telnet
          - rsh-client
          - rsh-server
          - nis
          - tftpd-hpa
          - bind9
          - vsftpd
          - dovecot-core
          - squid
          - snmpd
          - talk
          - talkd
          - postfix
          - wpasupplicant
          - avahi-daemon

        # Packages whose removal must abort the hardening instead.
        removal_protected_packages:
          - cloud-init
          - openssh-server
          - open-vm-tools
          - netplan.io
          - systemd
          - linux-image

        # Process accounting.
        installing_of_packages:
          - acct

        # Services without a purpose on a golden image. dbus is NOT disabled:
        # systemd-logind and VMware Tools need it.
        disable_of_services:
          - xinetd
          - rsh.socket
          - rlogin.socket
          - rexec.socket
          - ypbind
          - tftpd-hpa
          - kdump-tools
          - mdmonitor
          - ntpdate
          - bind9
          - apache2
          - dovecot
          - squid
          - snmpd
          - atd
          - smartmontools
          - rpcbind

        enable_of_services:
          - irqbalance
          - acct
          - cron
          - cloud-init-local
          - cloud-init
          - cloud-config
          - cloud-final

        # ip_forward is needed by container hosts; set to 0 otherwise.
        sysctl_ip_forward: 1
        sysctl_disable_ipv6: 1
        session_timeout_seconds: 900
        IMAGEBUILDER_ROLE_EOF
        cat > "$WORK/roles/system/tasks/main.yml" <<'IMAGEBUILDER_ROLE_EOF'
        ---
        # Baseline hardening for Ubuntu: sysctl and limits as drop-ins, PAM and
        # profile settings in the locations Ubuntu regenerates from.

        - name: Restrict dynamic mounting and unmounting of filesystems
          ansible.builtin.template:
            src: hardening.conf.j2
            dest: /etc/modprobe.d/hardening.conf
            mode: "0644"

        - name: Kernel parameters
          ansible.builtin.template:
            src: sysctl.conf.j2
            dest: /etc/sysctl.d/99-imagebuilder-hardening.conf
            mode: "0644"

        - name: Apply kernel parameters
          ansible.builtin.command: sysctl --system
          changed_when: false
          failed_when: false

        - name: Set security limits to prevent DoS
          ansible.builtin.template:
            src: limits.conf.j2
            dest: /etc/security/limits.d/99-imagebuilder-hardening.conf
            mode: "0644"

        - name: Removal of not needed accounts
          ansible.builtin.user:
            name: "{{ item }}"
            state: absent
          loop: "{{ removal_of_users }}"

        - name: Removal of not needed groups
          ansible.builtin.group:
            name: "{{ item }}"
            state: absent
          loop: "{{ removal_of_groups }}"

        - name: Check whether pam-auth-update manages unix authentication
          ansible.builtin.stat:
            path: /usr/share/pam-configs/unix
          register: pam_unix_config

        - name: Remove nullok from the PAM unix profile
          ansible.builtin.replace:
            path: /usr/share/pam-configs/unix
            regexp: '\s+nullok(_secure)?\b'
            replace: ''
          when: pam_unix_config.stat.exists
          register: pam_unix_changed

        - name: Regenerate PAM configuration
          ansible.builtin.command: pam-auth-update --package --force
          environment:
            DEBIAN_FRONTEND: noninteractive
          when: pam_unix_config.stat.exists and pam_unix_changed.changed

        - name: Set interactive session timeout
          ansible.builtin.copy:
            dest: /etc/profile.d/99-imagebuilder-tmout.sh
            content: |
              # Interactive session timeout (imagebuilder hardening)
              readonly TMOUT={{ session_timeout_seconds }}
              export TMOUT
            mode: "0644"

        - name: Simulate removal of packages
          ansible.builtin.command: "apt-get -s purge {{ removal_of_packages | join(' ') }}"
          register: removal_simulation
          changed_when: false
          failed_when: false

        - name: Refuse removals that would take protected packages with them
          ansible.builtin.assert:
            that:
              - not (removal_simulation.stdout is search('^Purg ' + item, multiline=True))
            fail_msg: "Removing the hardening package list would also remove {{ item }}"
          loop: "{{ removal_protected_packages }}"

        - name: Removal of packages
          ansible.builtin.apt:
            name: "{{ removal_of_packages }}"
            state: absent
            purge: true
            autoremove: false

        - name: Installation of packages
          ansible.builtin.apt:
            name: "{{ installing_of_packages }}"
            state: present
          failed_when: false

        - name: Disable of services
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
            enabled: false
          loop: "{{ disable_of_services }}"
          failed_when: false

        - name: Enabling of services
          ansible.builtin.systemd:
            name: "{{ item }}"
            enabled: true
          loop: "{{ enable_of_services }}"
          failed_when: false
        IMAGEBUILDER_ROLE_EOF
        cat > "$WORK/roles/system/templates/hardening.conf.j2" <<'IMAGEBUILDER_ROLE_EOF'
        # Restrict Dynamic Mounting and Unmounting of Filesystems

        blacklist usb-storage
        blacklist firewire-core

        {% if kernel_hardening_conf is defined and kernel_hardening_conf is iterable %}
        {% for entry in kernel_hardening_conf %}
        install {{ entry }} /bin/true
        {% endfor %}
        {% endif %}
        IMAGEBUILDER_ROLE_EOF
        cat > "$WORK/roles/system/templates/sysctl.conf.j2" <<'IMAGEBUILDER_ROLE_EOF'
        # Enable packet forwarding (Docker needs it)
        net.ipv4.ip_forward = {{ sysctl_ip_forward }}

        # Disable redirects, not a router
        net.ipv4.conf.all.accept_redirects = 0
        net.ipv4.conf.default.accept_redirects = 0
        net.ipv4.conf.all.send_redirects = 0
        net.ipv4.conf.default.send_redirects = 0
        net.ipv4.conf.all.secure_redirects = 0
        net.ipv4.conf.default.secure_redirects = 0
        net.ipv6.conf.all.accept_redirects = 0
        net.ipv6.conf.default.accept_redirects = 0

        # Disable source routing
        net.ipv4.conf.all.accept_source_route = 0
        net.ipv4.conf.default.accept_source_route = 0
        net.ipv6.conf.all.accept_source_route = 0

        # Enable source validation by reversed path
        net.ipv4.conf.all.rp_filter = 1
        net.ipv4.conf.default.rp_filter = 1

        # Log packets with impossible addresses to kernel log
        net.ipv4.conf.all.log_martians = 1
        net.ipv4.conf.default.log_martians = 1

        # Disable ICMP broadcasts
        net.ipv4.icmp_echo_ignore_broadcasts = 1

        # Ignore bogus ICMP errors
        net.ipv4.icmp_ignore_bogus_error_responses = 1

        # Against SYN flood attacks
        net.ipv4.tcp_syncookies = 1

        # Turning off timestamps could improve security but degrade performance.
        # TCP timestamps are used to improve performance as well as protect against
        # late packets messing up your data flow. A side effect of this feature is
        # that the uptime of the host can sometimes be computed.
        # If you disable TCP timestamps, you should expect worse performance
        # and less reliable connections.
        net.ipv4.tcp_timestamps = 1

        # Disable IPv6 unless required
        net.ipv6.conf.lo.disable_ipv6 = {{ sysctl_disable_ipv6 }}
        net.ipv6.conf.all.disable_ipv6 = {{ sysctl_disable_ipv6 }}
        net.ipv6.conf.default.disable_ipv6 = {{ sysctl_disable_ipv6 }}

        # Do not accept router advertisements
        net.ipv6.conf.all.accept_ra = 0
        net.ipv6.conf.default.accept_ra = 0

        # Disable core dumps
        fs.suid_dumpable = 0

        # Disable System Request debugging functionality
        kernel.sysrq = 0

        # Restrict access to kernel logs
        kernel.dmesg_restrict = 1

        # Randomise memory space
        kernel.randomize_va_space = 2

        # Hide kernel pointers
        kernel.kptr_restrict = 2
        IMAGEBUILDER_ROLE_EOF
        cat > "$WORK/roles/system/templates/limits.conf.j2" <<'IMAGEBUILDER_ROLE_EOF'
        # 4096 is a good starting point
        *      soft   nofile    4096
        *      hard   nofile    65536
        *      soft   nproc     4096
        *      hard   nproc     4096
        *      soft   locks     4096
        *      hard   locks     4096
        *      soft   stack     10240
        *      hard   stack     32768
        *      soft   memlock   64
        *      hard   memlock   64
        *      hard   maxlogins 10

        # Soft limit 32GB, hard 64GB
        *      soft   fsize     33554432
        *      hard   fsize     67108864

        # Limits for root
        root   soft   nofile    4096
        root   hard   nofile    65536
        root   soft   nproc     4096
        root   hard   nproc     4096
        root   soft   stack     10240
        root   hard   stack     32768
        root   soft   fsize     33554432

        {% if limits_conf is defined and limits_conf is iterable %}
        {% for entry in limits_conf %}
        {{ entry }}
        {% endfor %}
        {% endif %}
        IMAGEBUILDER_ROLE_EOF
        cd "$WORK"
        ANSIBLE_NOCOLOR=1 ansible-playbook -i localhost, -c local local.yml
    - type: shell
      inline: |
        #!/bin/sh
        # Remove podman if present.
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        echo "remove existing container services"
        if dpkg -s podman >/dev/null 2>&1; then
          apt-get remove -y podman
        fi
    - type: shell
      inline: |
        #!/bin/sh
        # Automation user with passwordless sudo. admin is substituted by
        # generate.py. The account is locked and keyless until cloud-init or the
        # deployment tooling injects a key.
        set -eu
        ADMIN_USER="admin"
        id "$ADMIN_USER" >/dev/null 2>&1 || useradd --create-home --shell /bin/bash --groups users "$ADMIN_USER"
        passwd -l "$ADMIN_USER" >/dev/null
        echo "${ADMIN_USER} ALL=(ALL) NOPASSWD:ALL" > "/etc/sudoers.d/${ADMIN_USER}"
        chmod 440 "/etc/sudoers.d/${ADMIN_USER}"
        visudo -cf "/etc/sudoers.d/${ADMIN_USER}"
        timedatectl set-timezone Europe/Berlin || ln -sf /usr/share/zoneinfo/Europe/Berlin /etc/localtime
        localectl set-keymap de || echo "WARN: keymap not set"
    - type: shell
      inline: |
        #!/bin/sh
        # Generalize the image: logs, SSH host keys, machine-id, cloud-init state.
        # The temporary build login is locked at the very end.
        set -u
        systemctl stop rsyslog 2>/dev/null || true
        apt-get clean

        logrotate -f /etc/logrotate.conf || true
        rm -f /var/log/*.gz /var/log/dmesg.old
        [ -d /var/log/audit ] && : > /var/log/audit/audit.log
        : > /var/log/wtmp
        : > /var/log/lastlog

        rm -rf /etc/ssh/ssh_host_*

        rm -fr /var/log/aide/* /var/log/audit/* /var/log/chrony/* /var/log/pluto/* /var/log/private/*
        journalctl --rotate >/dev/null 2>&1 || true
        journalctl --vacuum-time=1s >/dev/null 2>&1 || true
        rm -rf /var/log/journal/*

        rm -f /etc/udev/rules.d/70-persistent-net.rules

        rm -rf /var/lib/apt/lists/*
        rm -rf /tmp/* /var/tmp/*

        : > /etc/machine-id
        rm -f /var/lib/dbus/machine-id
        ln -s /etc/machine-id /var/lib/dbus/machine-id

        unset HISTFILE
        : > /root/.bash_history
        rm -f /root/.bash_history

        sed -i 's/preserve_hostname: false/preserve_hostname: true/g' /etc/cloud/cloud.cfg
        : > /etc/hostname
        : > /etc/hosts
        : > /etc/resolv.conf 2>/dev/null || true
        hostnamectl set-hostname localhost 2>/dev/null || true

        # 26.04: besides seed and logs, drop the rendered network config so the next
        # boot renders it for the new instance (the old netplan matches the build NIC).
        cloud-init clean --seed --logs --configs network

        # Lock the temporary build login (root password of the build VM) last.
        passwd -l root >/dev/null 2>&1 || true
        rm -f /var/log/imagebuilder-provision.log
        sync
  targets:
    - providerConfigRef:
        name: vsphere-templates
      format: ova
      tags:
        managed-by: imagebuilder
  build:
    mode: remote
    timeout: 3h0m0s
    artifactStorage:
      type: pvc
