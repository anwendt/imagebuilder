nameOverride: ""
fullnameOverride: ""

namespace:
  create: true
  name: imagebuilder-system
  podSecurity:
    enforce: restricted
    audit: restricted
    warn: restricted

namespaceResourceGuardrails:
  enabled: true
  resourceQuota:
    hard:
      requests.cpu: "8"
      requests.memory: 16Gi
      requests.storage: 500Gi
      limits.cpu: "16"
      limits.memory: 32Gi
      persistentvolumeclaims: "20"
      pods: "50"
      secrets: "100"
      services: "20"
  limitRange:
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: 50m
      memory: 64Mi

image:
  repository: ghcr.io/anwendt/imagebuilder-operator
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

builderImage:
  repository: ghcr.io/anwendt/imagebuilder-builder
  tag: "0.1.0"
  digest: ""

uploaderImage:
  repository: ghcr.io/anwendt/imagebuilder-uploader
  tag: "0.1.0"
  digest: ""

provisionerImages:
  ansible:
    repository: ghcr.io/anwendt/imagebuilder-provisioner-ansible
    tag: "0.1.0"
    digest: ""
  chef:
    repository: ghcr.io/anwendt/imagebuilder-provisioner-chef
    tag: "0.1.0"
    digest: ""
  custom:
    repository: ghcr.io/anwendt/imagebuilder-provisioner-custom
    tag: "0.1.0"
    digest: ""
  puppet:
    repository: ghcr.io/anwendt/imagebuilder-provisioner-puppet
    tag: "0.1.0"
    digest: ""
  saltstack:
    repository: ghcr.io/anwendt/imagebuilder-provisioner-saltstack
    tag: "0.1.0"
    digest: ""

replicaCount: 2

serviceAccount:
  create: true
  name: ""

leaderElection:
  enabled: true

schedulerNamespace: imagebuilder-system
providerNamespace: imagebuilder-system

providerSecurity:
  requireMTLS: true
  requireDigest: true
  requireSignature: true
  allowedRegistries:
    - ghcr.io/anwendt

imageSignaturePolicy:
  enabled: true
  imageReferences:
    - ghcr.io/anwendt/*
  keyless:
    issuer: https://token.actions.githubusercontent.com
    subject: https://github.com/*

maxConcurrentBuilds: 3
maxConcurrentBuildsPerNode: 1
logLevel: info

# proxy:
#   httpProxy: http://proxy.example.com:8080
#   httpsProxy: http://proxy.example.com:8443
#   noProxy: localhost,127.0.0.1,.svc,.cluster.local,169.254.169.254

metrics:
  enabled: true
  bindAddress: ":8080"
  serviceMonitor:
    enabled: false
    interval: 30s
  prometheusRule:
    enabled: false

webhook:
  enabled: true
  serviceName: imagebuilder-webhook-service
  port: 443
  targetPort: 9443
  failurePolicy: Fail
  timeoutSeconds: 10
  matchPolicy: Equivalent
  certManager:
    enabled: true
    issuerName: imagebuilder-selfsigned-issuer
    certificateName: imagebuilder-webhook-serving-cert
    secretName: imagebuilder-webhook-server-cert
  caBundle: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: true
  # Additional namespaces where VMImage build/upload jobs run. The chart renders
  # a scoped egress policy for imagebuilder-managed build/upload pods in each
  # namespace without applying namespace-wide default deny to tenant workloads.
  workloadNamespaces: []
