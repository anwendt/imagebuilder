nameOverride: ""
fullnameOverride: ""
developmentProfileAcknowledged: false

operator:
  namespaceScopedMode: false
  watchNamespace: ""

namespace:
  create: true
  name: imagebuilder-system
  podSecurity:
    enforce: restricted
    audit: restricted
    warn: restricted

namespaceResourceGuardrails:
  enabled: true
  resourceQuota:
    hard:
      requests.cpu: "8"
      requests.memory: 16Gi
      requests.storage: 500Gi
      limits.cpu: "16"
      limits.memory: 32Gi
      persistentvolumeclaims: "20"
      pods: "50"
      secrets: "100"
      services: "20"
  limitRange:
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: 50m
      memory: 64Mi

# Production defaults are immutable v0.4.2 multi-architecture image indexes.
# values-development.yaml clears these digests for locally loaded images.
imageDigestEnforcement:
  enabled: true

image:
  repository: ghcr.io/anwendt/imagebuilder-operator
  tag: "v0.4.2"
  digest: "sha256:2084d83aa7daa9e68d84f98931ed30e912db44e75b04df53ab89443903028aa0"
  pullPolicy: IfNotPresent

builderImage:
  repository: ghcr.io/anwendt/imagebuilder-builder
  tag: "v0.4.2"
  digest: "sha256:44770fa82f8cf824ad160e88b005f6ac42b0f27da560e6b8e57370e92ccf419a"

uploaderImage:
  repository: ghcr.io/anwendt/imagebuilder-uploader
  tag: "v0.4.2"
  digest: "sha256:0e8b3b42dc00723a3e8cfaf327866a4ce06a909ddf7fbf165d94f7b9d7d82dfc"

provisionerImages:
  ansible:
    repository: ghcr.io/anwendt/imagebuilder-provisioner-ansible
    tag: "v0.4.2"
    digest: "sha256:dcb4c6925cafecd3010c85de0d0518ed39676050a8ba50e9077ebad253872935"
  chef:
    repository: ghcr.io/anwendt/imagebuilder-provisioner-chef
    tag: "v0.4.2"
    digest: "sha256:a09846ff2c0d2d6bb1b40231661ab6ada062b697d2d78b1e6b5a012db279bb45"
  custom:
    repository: ghcr.io/anwendt/imagebuilder-provisioner-custom
    tag: "v0.4.2"
    digest: "sha256:0bd981535fbec5c0f998fa410380e7a507df3ef61624d11b9def239bce56fee9"
  puppet:
    repository: ghcr.io/anwendt/imagebuilder-provisioner-puppet
    tag: "v0.4.2"
    digest: "sha256:211c180769ee132f99a4901e9c663ee7df9b1913ea320d02b955b5f7f4491fa4"
  saltstack:
    repository: ghcr.io/anwendt/imagebuilder-provisioner-saltstack
    tag: "v0.4.2"
    digest: "sha256:2c67ca1574cc3cd08938740b9599db8c1bdcb8e7a49f35436b54b788b22d0959"

replicaCount: 2

serviceAccount:
  create: true
  name: ""

leaderElection:
  enabled: true

schedulerNamespace: imagebuilder-system
providerNamespace: imagebuilder-system

providerSecurity:
  requireMTLS: true
  requireDigest: true
  requireSignature: true
  restrictServiceAccounts: true
  allowedServiceAccounts: []
  forbidServiceAccountToken: true
  allowedRegistries:
    - ghcr.io/anwendt

imageSignaturePolicy:
  enabled: true
  imageReferences:
    - ghcr.io/anwendt/*
  keyless:
    issuer: https://token.actions.githubusercontent.com
    subject: https://github.com/*

maxConcurrentBuilds: 3
logLevel: info

# proxy:
#   httpProxy: http://proxy.example.com:8080
#   httpsProxy: http://proxy.example.com:8443
#   noProxy: localhost,127.0.0.1,.svc,.cluster.local,169.254.169.254

metrics:
  enabled: true
  bindAddress: ":8080"
  serviceMonitor:
    enabled: false
    interval: 30s
  prometheusRule:
    enabled: false

webhook:
  enabled: true
  serviceName: imagebuilder-webhook-service
  port: 443
  targetPort: 9443
  failurePolicy: Fail
  timeoutSeconds: 10
  matchPolicy: Equivalent
  certManager:
    enabled: true
    issuerName: imagebuilder-selfsigned-issuer
    certificateName: imagebuilder-webhook-serving-cert
    secretName: imagebuilder-webhook-server-cert
  caBundle: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: true
  # Additional namespaces where VMImage build/upload jobs run. The chart renders
  # a scoped egress policy for imagebuilder-managed build/upload pods in each
  # namespace without applying namespace-wide default deny to tenant workloads.
  workloadNamespaces: []
