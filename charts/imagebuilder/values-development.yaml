# Development profile for local clusters such as kind, k3d, minikube, or
# disposable test namespaces. It intentionally disables production guardrails
# that require extra cluster components or signed/digest-pinned provider images.

developmentProfileAcknowledged: false

replicaCount: 1

# Local images may be loaded directly into a development cluster. Clear the
# production release digests so tag overrides remain usable.
image:
  digest: ""
imageDigestEnforcement:
  enabled: false
builderImage:
  digest: ""
uploaderImage:
  digest: ""
provisionerImages:
  ansible:
    digest: ""
  chef:
    digest: ""
  custom:
    digest: ""
  puppet:
    digest: ""
  saltstack:
    digest: ""

leaderElection:
  enabled: false

webhook:
  enabled: false
  failurePolicy: Ignore
  certManager:
    enabled: false

networkPolicy:
  enabled: false
  workloadNamespaces: []

namespaceResourceGuardrails:
  enabled: false

providerSecurity:
  requireMTLS: false
  requireDigest: false
  requireSignature: false
  restrictServiceAccounts: false
  allowedServiceAccounts: []
  forbidServiceAccountToken: false
  allowedRegistries: []

imageSignaturePolicy:
  enabled: false
  imageReferences:
    - ghcr.io/anwendt/*
  keyless:
    issuer: https://token.actions.githubusercontent.com
    subject: https://github.com/*
