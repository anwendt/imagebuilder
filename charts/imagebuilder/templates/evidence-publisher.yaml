{{- if .Values.evidencePublisher.enabled }}
{{- /*
ADR-011 evidence publisher: the operator stores the guest evidence bundle in
a Secret and runs the publication Job in its own namespace, so the push and
cosign credentials never leave that namespace.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "imagebuilder.fullname" . }}-evidence-publisher
  namespace: {{ include "imagebuilder.namespace" . }}
  labels:
    {{- include "imagebuilder.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "imagebuilder.fullname" . }}-evidence-publisher
  namespace: {{ include "imagebuilder.namespace" . }}
  labels:
    {{- include "imagebuilder.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "imagebuilder.fullname" . }}-evidence-publisher
subjects:
  - kind: ServiceAccount
    name: {{ include "imagebuilder.serviceAccountName" . }}
    namespace: {{ include "imagebuilder.namespace" . }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "imagebuilder.fullname" . }}-evidence-publisher
  namespace: {{ include "imagebuilder.namespace" . }}
  labels:
    {{- include "imagebuilder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: imagebuilder
      app.kubernetes.io/component: evidence-publisher
  policyTypes:
    - Ingress
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
    {{- if .Values.networkPolicy.proxy.enabled }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.proxy.cidr | quote }}
      ports:
        - port: {{ .Values.networkPolicy.proxy.port }}
          protocol: TCP
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
{{- end }}
