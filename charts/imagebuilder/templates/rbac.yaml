{{- if not .Values.operator.namespaceScopedMode }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "imagebuilder.fullname" . }}
  labels:
    {{- include "imagebuilder.labels" . | nindent 4 }}
rules:
  - apiGroups: ["imagebuilder.io"]
    # controller-runtime adds and removes finalizers with a normal resource
    # Update, so the two reconciled resource kinds require update in every
    # namespace watched by this cluster-scoped operator.
    resources: ["vmimages", "platformproviders"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["imagebuilder.io"]
    resources: ["providerconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["imagebuilder.io"]
    resources: ["vmimages/status", "platformproviders/status", "providerconfigs/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["imagebuilder.io"]
    resources: ["vmimages/finalizers", "platformproviders/finalizers"]
    verbs: ["update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies"]
    verbs: ["get"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "imagebuilder.fullname" . }}
  labels:
    {{- include "imagebuilder.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "imagebuilder.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "imagebuilder.serviceAccountName" . }}
    namespace: {{ include "imagebuilder.namespace" . }}
  {{- end }}
