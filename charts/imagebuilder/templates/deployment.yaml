{{- if .Values.imageDigestEnforcement.enabled }}
{{- $images := dict "operator" .Values.image "builder" .Values.builderImage "uploader" .Values.uploaderImage "ansible" .Values.provisionerImages.ansible "chef" .Values.provisionerImages.chef "custom" .Values.provisionerImages.custom "puppet" .Values.provisionerImages.puppet "saltstack" .Values.provisionerImages.saltstack }}
{{- range $name, $image := $images }}
{{- if not (regexMatch "^sha256:[0-9a-fA-F]{64}$" ($image.digest | default "")) }}
{{- fail (printf "imageDigestEnforcement requires %s image digest to be sha256-pinned" $name) }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.operator.namespaceScopedMode }}
{{- $watchNamespace := default (include "imagebuilder.namespace" .) .Values.operator.watchNamespace }}
{{- if ne $watchNamespace .Values.providerNamespace }}
{{- fail "namespace-scoped mode requires providerNamespace to equal operator.watchNamespace" }}
{{- end }}
{{- if ne $watchNamespace .Values.schedulerNamespace }}
{{- fail "namespace-scoped mode requires schedulerNamespace to equal operator.watchNamespace" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "imagebuilder.fullname" . }}
  namespace: {{ include "imagebuilder.namespace" . }}
  labels:
    {{- include "imagebuilder.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "imagebuilder.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "imagebuilder.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "imagebuilder.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          image: "{{ include "imagebuilder.imageRef" .Values.image }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.leaderElection.enabled }}
            - --namespace-scoped-mode={{ .Values.operator.namespaceScopedMode }}
            - --watch-namespace={{ default (include "imagebuilder.namespace" .) .Values.operator.watchNamespace }}
            - --max-concurrent-builds={{ .Values.maxConcurrentBuilds }}
            - --scheduler-namespace={{ .Values.schedulerNamespace }}
            - --provider-namespace={{ .Values.providerNamespace }}
            - --require-provider-mtls={{ .Values.providerSecurity.requireMTLS }}
            - --require-provider-digest={{ .Values.providerSecurity.requireDigest }}
            - --require-provider-signature={{ .Values.providerSecurity.requireSignature }}
            - --restrict-provider-serviceaccounts={{ .Values.providerSecurity.restrictServiceAccounts }}
            - --forbid-provider-serviceaccount-token={{ .Values.providerSecurity.forbidServiceAccountToken }}
            {{- if .Values.providerSecurity.allowedServiceAccounts }}
            - --allowed-provider-serviceaccounts={{ join "," .Values.providerSecurity.allowedServiceAccounts }}
            {{- end }}
            {{- if and .Values.providerSecurity.requireSignature .Values.imageSignaturePolicy.enabled }}
            - --provider-signature-policy={{ include "imagebuilder.fullname" . }}-require-signed-digests
            {{- end }}
            {{- if .Values.providerSecurity.allowedRegistries }}
            - --allowed-provider-registries={{ join "," .Values.providerSecurity.allowedRegistries }}
            {{- end }}
            - --metrics-bind-address={{ .Values.metrics.bindAddress }}
            - --health-probe-bind-address=:8081
            - --log-level={{ .Values.logLevel }}
          env:
            - name: BUILDER_IMAGE
              value: {{ include "imagebuilder.imageRef" .Values.builderImage | quote }}
            - name: UPLOADER_IMAGE
              value: {{ include "imagebuilder.imageRef" .Values.uploaderImage | quote }}
            - name: PROVISIONER_ANSIBLE_IMAGE
              value: {{ include "imagebuilder.imageRef" .Values.provisionerImages.ansible | quote }}
            - name: PROVISIONER_CHEF_IMAGE
              value: {{ include "imagebuilder.imageRef" .Values.provisionerImages.chef | quote }}
            - name: PROVISIONER_CUSTOM_IMAGE
              value: {{ include "imagebuilder.imageRef" .Values.provisionerImages.custom | quote }}
            - name: PROVISIONER_PUPPET_IMAGE
              value: {{ include "imagebuilder.imageRef" .Values.provisionerImages.puppet | quote }}
            - name: PROVISIONER_SALTSTACK_IMAGE
              value: {{ include "imagebuilder.imageRef" .Values.provisionerImages.saltstack | quote }}
            {{- with .Values.proxy }}
            {{- with .httpProxy }}
            - name: HTTP_PROXY
              value: {{ . | quote }}
            - name: http_proxy
              value: {{ . | quote }}
            {{- end }}
            {{- with .httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ . | quote }}
            - name: https_proxy
              value: {{ . | quote }}
            {{- end }}
            {{- with .noProxy }}
            - name: NO_PROXY
              value: {{ . | quote }}
            - name: no_proxy
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.webhook.targetPort }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: webhook-certs
          secret:
            secretName: {{ .Values.webhook.certManager.secretName }}
      {{- end }}
