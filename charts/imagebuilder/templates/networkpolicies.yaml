{{- if .Values.networkPolicy.enabled }}
{{- $root := . }}
{{- $operatorNamespace := include "imagebuilder.namespace" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "imagebuilder.fullname" . }}-default-deny
  namespace: {{ include "imagebuilder.namespace" . }}
  labels:
    {{- include "imagebuilder.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "imagebuilder.fullname" . }}-operator
  namespace: {{ include "imagebuilder.namespace" . }}
  labels:
    {{- include "imagebuilder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "imagebuilder.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        - port: {{ .Values.webhook.targetPort }}
          protocol: TCP
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- if .Values.networkPolicy.proxy.enabled }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.proxy.cidr | quote }}
      ports:
        - port: {{ .Values.networkPolicy.proxy.port }}
          protocol: TCP
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: imagebuilder
            matchExpressions:
              - key: imagebuilder.io/provider-name
                operator: Exists
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "imagebuilder.namespace" . }}
      ports:
        - port: 50051
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "imagebuilder.fullname" . }}-provider
  namespace: {{ include "imagebuilder.namespace" . }}
  labels:
    {{- include "imagebuilder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: imagebuilder
    matchExpressions:
      - key: imagebuilder.io/provider-name
        operator: Exists
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "imagebuilder.selectorLabels" . | nindent 14 }}
      ports:
        - port: 50051
          protocol: TCP
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - {{ include "imagebuilder.namespace" . }}
                  {{- range .Values.networkPolicy.workloadNamespaces }}
                  - {{ . }}
                  {{- end }}
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: imagebuilder
              imagebuilder.io/job-kind: upload
      ports:
        - port: 50051
          protocol: TCP
  egress:
    - ports:
        - port: 443
          protocol: TCP
    {{- if .Values.networkPolicy.proxy.enabled }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.proxy.cidr | quote }}
      ports:
        - port: {{ .Values.networkPolicy.proxy.port }}
          protocol: TCP
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "imagebuilder.fullname" . }}-build-upload-jobs
  namespace: {{ include "imagebuilder.namespace" . }}
  labels:
    {{- include "imagebuilder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: imagebuilder
    matchExpressions:
      - key: imagebuilder.io/job-kind
        operator: In
        values:
          - build
          - upload
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
    {{- if .Values.networkPolicy.proxy.enabled }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.proxy.cidr | quote }}
      ports:
        - port: {{ .Values.networkPolicy.proxy.port }}
          protocol: TCP
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $operatorNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: imagebuilder
            matchExpressions:
              - key: imagebuilder.io/provider-name
                operator: Exists
      ports:
        - port: 50051
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- range .Values.networkPolicy.workloadNamespaces }}
{{- if ne . $operatorNamespace }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "imagebuilder.fullname" $root }}-build-upload-jobs
  namespace: {{ . }}
  labels:
    {{- include "imagebuilder.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: imagebuilder
    matchExpressions:
      - key: imagebuilder.io/job-kind
        operator: In
        values:
          - build
          - upload
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
    {{- if $root.Values.networkPolicy.proxy.enabled }}
    - to:
        - ipBlock:
            cidr: {{ $root.Values.networkPolicy.proxy.cidr | quote }}
      ports:
        - port: {{ $root.Values.networkPolicy.proxy.port }}
          protocol: TCP
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $operatorNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: imagebuilder
            matchExpressions:
              - key: imagebuilder.io/provider-name
                operator: Exists
      ports:
        - port: 50051
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
{{- end }}
{{- end }}
