{{- if .Values.namespaceResourceGuardrails.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "imagebuilder.fullname" . }}-quota
  namespace: {{ include "imagebuilder.namespace" . }}
  labels:
    {{- include "imagebuilder.labels" . | nindent 4 }}
spec:
  hard:
    {{- toYaml .Values.namespaceResourceGuardrails.resourceQuota.hard | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "imagebuilder.fullname" . }}-limits
  namespace: {{ include "imagebuilder.namespace" . }}
  labels:
    {{- include "imagebuilder.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        {{- toYaml .Values.namespaceResourceGuardrails.limitRange.default | nindent 8 }}
      defaultRequest:
        {{- toYaml .Values.namespaceResourceGuardrails.limitRange.defaultRequest | nindent 8 }}
      max:
        {{- toYaml .Values.namespaceResourceGuardrails.limitRange.max | nindent 8 }}
      min:
        {{- toYaml .Values.namespaceResourceGuardrails.limitRange.min | nindent 8 }}
{{- end }}
