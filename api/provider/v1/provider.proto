// api/provider/v1/provider.proto
//
// This is the stable gRPC contract between the core operator and external
// platform provider pods. Treat field numbers as permanent — never reuse them.
//
// Breaking changes require a new package: imagebuilder.provider.v2
//
// License: Apache 2.0
//
// Generate Go code:
//   protoc --proto_path=api/provider/v1 \
//          --go_out=api/provider/v1 --go_opt=paths=source_relative \
//          --go-grpc_out=api/provider/v1 --go-grpc_opt=paths=source_relative \
//          api/provider/v1/provider.proto
//
// Or: make proto

syntax = "proto3";

package imagebuilder.provider.v1;

option go_package = "github.com/anwendt/imagebuilder/api/provider/v1;providerv1";

// PlatformProvider is the gRPC service that every external provider pod must implement.
// The operator and upload Jobs connect to the provider's controller-managed
// ClusterIP Service over TCP, optionally protected by mutual TLS.
service PlatformProvider {
  // GetCapabilities is called once after the provider pod becomes ready.
  // The operator uses the response to populate PlatformProvider.status.capabilities
  // and to validate VMImage targets before starting a build.
  rpc GetCapabilities(Empty) returns (CapabilitiesResponse);

  // ValidateConfig checks a ProviderConfig before a build starts.
  // Called every time a VMImage references a ProviderConfig backed by this provider.
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);

  // UploadArtifact streams the build artifact from the operator to the provider.
  // The provider uploads it to the target platform (S3, Glance, datastore, ...).
  // Streaming allows large images (50GB+) without memory pressure.
  rpc UploadArtifact(stream UploadChunk) returns (stream UploadProgress);

  // RegisterImage makes the uploaded artifact available as a platform image.
  // Called after UploadArtifact completes successfully.
  rpc RegisterImage(RegisterRequest) returns (ImageRef);

  // DeleteArtifact removes a previously uploaded artifact.
  // Called on build failure or explicit cleanup. Must be idempotent.
  rpc DeleteArtifact(DeleteRequest) returns (DeleteResponse);

  // HealthCheck is called periodically by the operator.
  // Return an error to signal the provider is unhealthy.
  rpc HealthCheck(Empty) returns (HealthResponse);

  // ReconcileRemoteBuild starts or continues a provider-owned remote build.
  // This is additive in v1 and must be idempotent for the same build_id and
  // operation_ref. Providers that do not advertise build_modes=["remote"] may
  // return Unimplemented.
  rpc ReconcileRemoteBuild(RemoteBuildRequest) returns (RemoteBuildResponse);

  // CleanupRemoteBuild removes provider-owned resources for a remote build.
  // Called after deletion, timeout, cancellation, or failed reconciliation.
  // Must be idempotent and must not return or log secret material.
  rpc CleanupRemoteBuild(RemoteBuildRequest) returns (RemoteBuildCleanupResponse);
}

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

message Empty {}

// ---------------------------------------------------------------------------
// GetCapabilities
// ---------------------------------------------------------------------------

message CapabilitiesResponse {
  // provider_name must match the PlatformProvider CR name e.g. "aws"
  string provider_name     = 1;
  string provider_version  = 2;  // semver e.g. "v1.2.0"

  // formats this provider can receive e.g. ["vmdk", "ova"]
  repeated string formats  = 3;

  // os_families this provider supports: "linux", "windows"
  repeated string os_families = 4;

  // protocol_version of this proto schema e.g. "v1"
  // Operator rejects providers with incompatible protocol versions.
  string protocol_version  = 5;

  // build_modes lists execution modes supported by the provider.
  // Omitted means ["local"] for backward compatibility.
  repeated string build_modes = 6;

  // upload_resume_mode declares upload retry semantics. An empty value means
  // the legacy non-resumable protocol. "restart" provides an idempotent
  // session but restarts at byte zero; "offset" resumes at committed_offset.
  string upload_resume_mode = 20;
}

// ---------------------------------------------------------------------------
// ReconcileRemoteBuild
// ---------------------------------------------------------------------------

message RemoteBuildRequest {
  string build_id = 1;
  string operation_ref = 2;
  string image_name = 3;
  string namespace = 4;
  string os_family = 5;
  string os_distribution = 6;
  string os_version = 7;
  string os_arch = 8;
  string source_type = 9;
  string source_url = 10;
  string source_checksum = 11;
  string provider_config_name = 12;
  string format = 13;
  map<string, string> tags = 14;
  repeated RemoteProvisioner provisioners = 15;
  RemoteGuestAccess guest_access = 16;
  int64 timeout_seconds = 17;
  // source_provider_ref is an opaque provider-native source reference such as
  // an AMI ID, vSphere template ID, Glance UUID, or cloud image resource name.
  // Prefer this over overloading source_url for remote builds.
  string source_provider_ref = 18;
  MarketplaceRef source_marketplace = 19;
}

message MarketplaceRef {
  string publisher = 1;
  string offer = 2;
  string sku = 3;
  string version = 4;
}

message RemoteProvisioner {
  string type = 1;
  string image = 2;
  string inline = 3;
  string playbook = 4;
  repeated string args = 5;
  map<string, string> extra_vars = 6;
  RemoteProvisionerSource source = 7;
}

message RemoteProvisionerSource {
  RemoteGitProvisionerSource git = 1;
}

message RemoteGitProvisionerSource {
  string url = 1;
  string ref = 2;
  string path = 3;
  RemoteGitProvisionerAuth auth = 4;
}

message RemoteGitProvisionerAuth {
  string token = 1;
  string username = 2;
  string password = 3;
}

message RemoteGuestAccess {
  string protocol = 1;
  string user = 2;
  int32 guest_port = 3;
  bool generated_ssh_key = 4;
  bool generated_password = 5;
  string injection_method = 6;
}

message RemoteBuildResponse {
  string operation_ref = 1;
  string phase = 2;
  string message = 3;
  bool done = 4;
  repeated RemoteImageRef images = 5;
  RemoteArtifact artifact = 6;
  RemoteHygieneResult hygiene = 7;
}

message RemoteHygieneResult {
  // status is provider-neutral and should be "passed", "failed", or "unknown".
  string status = 1;
  // message is copied into VMImage status/events and must not contain secrets.
  string message = 2;
  // checks contains provider-neutral check identifiers such as
  // "temporary-user-removed" or "bootstrap-files-removed".
  repeated string checks = 3;
  // result_ref is an optional non-secret provider/workspace reference to a
  // detailed hygiene report.
  string result_ref = 4;
}

message RemoteImageRef {
  string provider = 1;
  string provider_config_name = 2;
  string image_ref = 3;
  string image_name = 4;
  string location = 5;
  string format = 6;
  string checksum = 7;
  map<string, string> tags = 8;
}

message RemoteArtifact {
  string path = 1;
  string format = 2;
  string checksum = 3;
  int64 size_bytes = 4;
  string os_family = 5;
  map<string, string> metadata = 6;
}

message RemoteBuildCleanupResponse {
  bool cleaned = 1;
  string message = 2;
}

// ---------------------------------------------------------------------------
// ValidateConfig
// ---------------------------------------------------------------------------

message ValidateConfigRequest {
  // provider_config_name is the name of the ProviderConfig CR
  string provider_config_name = 1;

  // credentials is the decoded secret content
  map<string, bytes> credentials = 2;

  // region / endpoint from ProviderConfigSpec
  string region   = 3;
  string endpoint = 4;
  bool   insecure = 5;

  // extra holds provider-specific key-value config
  map<string, string> extra = 6;
}

message ValidateConfigResponse {
  bool   valid   = 1;
  string message = 2;  // human-readable error when valid=false
}

// ---------------------------------------------------------------------------
// UploadArtifact (client streaming + server streaming)
// ---------------------------------------------------------------------------

message UploadChunk {
  // data is the raw bytes of this chunk
  bytes data   = 1;
  int64 offset = 2;
  bool  last   = 3;   // true on the final chunk

  // These fields are only populated in the FIRST chunk (offset=0)
  string format            = 10;  // ImageFormat e.g. "vmdk"
  string checksum          = 11;  // sha256:hex of the complete artifact
  int64  total_size_bytes  = 12;
  string os_family         = 13;
  map<string, string> metadata = 14;

  // provider_config_name identifies which ProviderConfig to use
  string provider_config_name = 15;

  // Additive upload-session fields. The first message is a metadata-only
  // session request when upload_resume_mode is advertised. idempotency_key is
  // stable across Job attempts. session_token is the opaque token returned by
  // the provider, and resume_offset is the last provider-committed byte.
  string idempotency_key = 20;
  string session_token = 21;
  int64 resume_offset = 22;
}

message UploadProgress {
  int64  bytes_written = 1;
  int64  total_bytes   = 2;
  string phase         = 3;  // "uploading" | "converting" | "verifying"
  string message       = 4;

  // provider_ref is set in the final progress message (phase="done")
  // It is passed back to RegisterImage.
  string provider_ref  = 5;

  // session_token and committed_offset form a durable resume checkpoint.
  // phase="session" acknowledges the metadata-only first UploadChunk before
  // the client sends artifact bytes. committed_offset is authoritative and
  // may be lower than the requested resume_offset.
  string session_token = 20;
  int64 committed_offset = 21;
  string resume_mode = 22;
}

// ---------------------------------------------------------------------------
// RegisterImage
// ---------------------------------------------------------------------------

message RegisterRequest {
  // provider_ref is the ProviderRef from the final UploadProgress message
  string provider_ref = 1;

  // image_name is the desired name for the registered image
  string image_name = 2;

  // tags to apply to the registered image
  map<string, string> tags = 3;

  // provider_config_name identifies which ProviderConfig to use
  string provider_config_name = 4;

  // format of the artifact that was uploaded
  string format = 5;

  // idempotency_key identifies the logical registration across retries. A
  // provider must return the previously-created image for the same key rather
  // than create a duplicate.
  string idempotency_key = 6;
}

message ImageRef {
  string id       = 1;  // AMI-ID, Image-UUID, MOID, ...
  string name     = 2;
  string location = 3;  // region, datacenter, project
  map<string, string> tags = 4;
}

// ---------------------------------------------------------------------------
// DeleteArtifact
// ---------------------------------------------------------------------------

message DeleteRequest {
  string provider_ref         = 1;
  string provider_config_name = 2;
}

message DeleteResponse {
  bool   deleted = 1;
  string message = 2;
}

// ---------------------------------------------------------------------------
// HealthCheck
// ---------------------------------------------------------------------------

message HealthResponse {
  bool   healthy = 1;
  string message = 2;
}
