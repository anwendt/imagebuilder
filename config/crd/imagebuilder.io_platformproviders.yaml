---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: platformproviders.imagebuilder.io
spec:
  group: imagebuilder.io
  names:
    kind: PlatformProvider
    listKind: PlatformProviderList
    plural: platformproviders
    singular: platformprovider
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.package
      name: Package
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PlatformProvider installs a platform plugin as a Kubernetes Deployment.
          The operator pulls the specified OCI image and starts it as a pod running
          a gRPC server. Once healthy, the provider is available for VMImage targets.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PlatformProviderSpec defines the desired state of PlatformProvider.
              Analog to Crossplane's Provider CRD — the operator pulls the OCI image
              and starts it as a Kubernetes Deployment. The provider pod runs a gRPC
              server implementing the PlatformProvider protobuf service.
            properties:
              controllerConfigRef:
                description: ControllerConfigRef references a ControllerConfig for
                  resource overrides
                type: string
              package:
                description: |-
                  Package is the OCI image reference for the provider
                  e.g. ghcr.io/yourorg/imagebuilder-provider-aws:v1.2.0
                type: string
              packagePullPolicy:
                default: IfNotPresent
                description: PackagePullPolicy controls when the image is pulled
                enum:
                - Always
                - Never
                - IfNotPresent
                type: string
              packagePullSecrets:
                description: PackagePullSecrets are references to secrets for pulling
                  the provider image
                items:
                  type: string
                type: array
              security:
                description: Security controls supply-chain policy for the provider
                  package.
                properties:
                  allowedRegistries:
                    description: |-
                      AllowedRegistries restricts package references to these registry prefixes,
                      for example ghcr.io/yourorg or registry.example.com/platform.
                    items:
                      type: string
                    type: array
                  requireDigest:
                    description: RequireDigest rejects mutable tag-only image references.
                    type: boolean
                  verifySignature:
                    description: |-
                      VerifySignature marks this provider as requiring signature verification.
                      The core enforces immutable digest references and records the policy in
                      the Deployment; cluster admission can bind this to cosign/Sigstore.
                    type: boolean
                type: object
              transport:
                description: |-
                  Transport configures operator-to-provider gRPC transport security.
                  Defaults to plaintext TCP inside the namespace-local ClusterIP and
                  NetworkPolicy trust boundary. Use mTLS for cross-boundary endpoints.
                properties:
                  tls:
                    description: |-
                      TLS configures gRPC TLS. When mode is Mutual, the operator verifies the
                      provider certificate against caSecretRef and presents client credentials
                      from clientCertificateSecretRef.
                    properties:
                      caSecretRef:
                        description: |-
                          CASecretRef references the CA bundle used to verify the provider server.
                          Required when mode=Mutual.
                        properties:
                          caKey:
                            description: CAKey is the key containing a PEM CA bundle.
                              Defaults to ca.crt.
                            type: string
                          certKey:
                            description: CertKey is the key containing a PEM certificate.
                              Defaults to tls.crt.
                            type: string
                          keyKey:
                            description: KeyKey is the key containing a PEM private
                              key. Defaults to tls.key.
                            type: string
                          name:
                            description: Name is the Secret name.
                            type: string
                          namespace:
                            description: |-
                              Namespace is the Secret namespace. Required for cluster-scoped
                              PlatformProvider resources.
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      clientCertificateSecretRef:
                        description: |-
                          ClientCertificateSecretRef references the operator client certificate and
                          private key presented to the provider. Required when mode=Mutual.
                        properties:
                          caKey:
                            description: CAKey is the key containing a PEM CA bundle.
                              Defaults to ca.crt.
                            type: string
                          certKey:
                            description: CertKey is the key containing a PEM certificate.
                              Defaults to tls.crt.
                            type: string
                          keyKey:
                            description: KeyKey is the key containing a PEM private
                              key. Defaults to tls.key.
                            type: string
                          name:
                            description: Name is the Secret name.
                            type: string
                          namespace:
                            description: |-
                              Namespace is the Secret namespace. Required for cluster-scoped
                              PlatformProvider resources.
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      mode:
                        default: Disabled
                        description: |-
                          Mode selects provider gRPC TLS behavior.
                          Disabled keeps plaintext TCP and is valid only inside the local
                          ClusterIP + NetworkPolicy trust boundary. Mutual enables mTLS.
                        enum:
                        - Disabled
                        - Mutual
                        type: string
                      serverCertificateSecretRef:
                        description: |-
                          ServerCertificateSecretRef references the provider server certificate and
                          private key mounted into the provider pod. Required when mode=Mutual for
                          operator-managed provider Deployments.
                        properties:
                          caKey:
                            description: CAKey is the key containing a PEM CA bundle.
                              Defaults to ca.crt.
                            type: string
                          certKey:
                            description: CertKey is the key containing a PEM certificate.
                              Defaults to tls.crt.
                            type: string
                          keyKey:
                            description: KeyKey is the key containing a PEM private
                              key. Defaults to tls.key.
                            type: string
                          name:
                            description: Name is the Secret name.
                            type: string
                          namespace:
                            description: |-
                              Namespace is the Secret namespace. Required for cluster-scoped
                              PlatformProvider resources.
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      serverName:
                        description: |-
                          ServerName is the expected DNS name in the provider server certificate.
                          If omitted, the provider service DNS name is used.
                        type: string
                    type: object
                type: object
            required:
            - package
            type: object
          status:
            properties:
              capabilities:
                description: Capabilities reported by the provider after successful
                  handshake
                properties:
                  buildModes:
                    description: |-
                      BuildModes lists supported build execution modes. Providers that omit
                      this field are treated as supporting only local upload/register flows.
                    items:
                      type: string
                    type: array
                  formats:
                    items:
                      type: string
                    type: array
                  osFamilies:
                    items:
                      type: string
                    type: array
                  protocolVersion:
                    type: string
                  providerName:
                    type: string
                  providerVersion:
                    type: string
                required:
                - formats
                - osFamilies
                - protocolVersion
                - providerName
                - providerVersion
                type: object
              conditions:
                description: Conditions follow the standard Kubernetes condition pattern
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentRevision:
                description: CurrentRevision is the resolved image digest currently
                  running
                type: string
              phase:
                description: Phase of the provider lifecycle
                enum:
                - Installing
                - Healthy
                - Unhealthy
                - Unknown
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
