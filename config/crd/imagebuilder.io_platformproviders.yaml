---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: platformproviders.imagebuilder.io
spec:
  group: imagebuilder.io
  names:
    kind: PlatformProvider
    listKind: PlatformProviderList
    plural: platformproviders
    singular: platformprovider
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.package
      name: Package
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PlatformProvider installs a platform plugin as a Kubernetes Deployment.
          The operator pulls the specified OCI image and starts it as a pod running
          a gRPC server. Once healthy, the provider is available for VMImage targets.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PlatformProviderSpec defines the desired state of PlatformProvider.
              Analog to Crossplane's Provider CRD — the operator pulls the OCI image
              and starts it as a Kubernetes Deployment. The provider pod runs a gRPC
              server implementing the PlatformProvider protobuf service.
            properties:
              automountServiceAccountToken:
                description: |-
                  AutomountServiceAccountToken controls API token projection for provider
                  pods. Defaults to false. Set true only when required by workload identity.
                type: boolean
              controllerConfigRef:
                description: ControllerConfigRef references a ControllerConfig for
                  resource overrides
                type: string
              env:
                description: |-
                  Env injects non-secret environment variables into the provider container.
                  Use mounted Secret/ConfigMap references for sensitive values.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              package:
                description: |-
                  Package is the OCI image reference for the provider
                  e.g. ghcr.io/yourorg/imagebuilder-provider-aws:v1.2.0
                type: string
              packagePullPolicy:
                default: IfNotPresent
                description: PackagePullPolicy controls when the image is pulled
                enum:
                - Always
                - Never
                - IfNotPresent
                type: string
              packagePullSecrets:
                description: PackagePullSecrets are references to secrets for pulling
                  the provider image
                items:
                  type: string
                type: array
              podAnnotations:
                additionalProperties:
                  type: string
                description: PodAnnotations are merged into the provider pod template
                  annotations.
                type: object
              podLabels:
                additionalProperties:
                  type: string
                description: PodLabels are merged into the provider pod template labels.
                type: object
              security:
                description: Security controls supply-chain policy for the provider
                  package.
                properties:
                  allowedRegistries:
                    description: |-
                      AllowedRegistries restricts package references to these registry prefixes,
                      for example ghcr.io/yourorg or registry.example.com/platform.
                    items:
                      type: string
                    type: array
                  requireDigest:
                    description: RequireDigest rejects mutable tag-only image references.
                    type: boolean
                  verifySignature:
                    description: |-
                      VerifySignature marks this provider as requiring signature verification.
                      The core enforces immutable digest references and records the policy in
                      the Deployment; cluster admission can bind this to cosign/Sigstore.
                    type: boolean
                type: object
              serviceAccountName:
                description: |-
                  ServiceAccountName sets the ServiceAccount used by the provider pod.
                  This is required for cloud workload identity integrations.
                type: string
              transport:
                description: |-
                  Transport configures operator-to-provider gRPC transport security.
                  Defaults to plaintext TCP inside the namespace-local ClusterIP and
                  NetworkPolicy trust boundary unless the operator is started with a
                  global require-provider-mtls policy. Use mTLS for cross-boundary endpoints.
                properties:
                  tls:
                    description: |-
                      TLS configures gRPC TLS. When mode is Mutual, the operator verifies the
                      provider certificate against caSecretRef and presents client credentials
                      from clientCertificateSecretRef.
                    properties:
                      caSecretRef:
                        description: |-
                          CASecretRef references the CA bundle used to verify the provider server.
                          Required when mode=Mutual.
                        properties:
                          caKey:
                            description: CAKey is the key containing a PEM CA bundle.
                              Defaults to ca.crt.
                            type: string
                          certKey:
                            description: CertKey is the key containing a PEM certificate.
                              Defaults to tls.crt.
                            type: string
                          keyKey:
                            description: KeyKey is the key containing a PEM private
                              key. Defaults to tls.key.
                            type: string
                          name:
                            description: Name is the Secret name.
                            type: string
                          namespace:
                            description: |-
                              Namespace is the Secret namespace. Required for cluster-scoped
                              PlatformProvider resources.
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      clientCertificateSecretRef:
                        description: |-
                          ClientCertificateSecretRef references the operator client certificate and
                          private key presented to the provider. Required when mode=Mutual.
                        properties:
                          caKey:
                            description: CAKey is the key containing a PEM CA bundle.
                              Defaults to ca.crt.
                            type: string
                          certKey:
                            description: CertKey is the key containing a PEM certificate.
                              Defaults to tls.crt.
                            type: string
                          keyKey:
                            description: KeyKey is the key containing a PEM private
                              key. Defaults to tls.key.
                            type: string
                          name:
                            description: Name is the Secret name.
                            type: string
                          namespace:
                            description: |-
                              Namespace is the Secret namespace. Required for cluster-scoped
                              PlatformProvider resources.
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      mode:
                        default: Disabled
                        description: |-
                          Mode selects provider gRPC TLS behavior.
                          Disabled keeps plaintext TCP and is valid only inside the local
                          ClusterIP + NetworkPolicy trust boundary. Mutual enables mTLS.
                        enum:
                        - Disabled
                        - Mutual
                        type: string
                      serverCertificateSecretRef:
                        description: |-
                          ServerCertificateSecretRef references the provider server certificate and
                          private key mounted into the provider pod. Required when mode=Mutual for
                          operator-managed provider Deployments.
                        properties:
                          caKey:
                            description: CAKey is the key containing a PEM CA bundle.
                              Defaults to ca.crt.
                            type: string
                          certKey:
                            description: CertKey is the key containing a PEM certificate.
                              Defaults to tls.crt.
                            type: string
                          keyKey:
                            description: KeyKey is the key containing a PEM private
                              key. Defaults to tls.key.
                            type: string
                          name:
                            description: Name is the Secret name.
                            type: string
                          namespace:
                            description: |-
                              Namespace is the Secret namespace. Required for cluster-scoped
                              PlatformProvider resources.
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      serverName:
                        description: |-
                          ServerName is the expected DNS name in the provider server certificate.
                          If omitted, the provider service DNS name is used.
                        type: string
                    type: object
                type: object
            required:
            - package
            type: object
          status:
            properties:
              capabilities:
                description: Capabilities reported by the provider after successful
                  handshake
                properties:
                  buildModes:
                    description: |-
                      BuildModes lists supported build execution modes. Providers that omit
                      this field are treated as supporting only local upload/register flows.
                    items:
                      type: string
                    type: array
                  formats:
                    items:
                      type: string
                    type: array
                  osFamilies:
                    items:
                      type: string
                    type: array
                  protocolVersion:
                    type: string
                  providerName:
                    type: string
                  providerVersion:
                    type: string
                required:
                - formats
                - osFamilies
                - protocolVersion
                - providerName
                - providerVersion
                type: object
              conditions:
                description: Conditions follow the standard Kubernetes condition pattern
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentRevision:
                description: CurrentRevision is the resolved image digest currently
                  running
                type: string
              phase:
                description: Phase of the provider lifecycle
                enum:
                - Installing
                - Healthy
                - Unhealthy
                - Unknown
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
