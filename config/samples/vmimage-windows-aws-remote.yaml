# Example: AWS Windows remote build from an existing SSM-ready Windows AMI.
# Replace AMI, subnet, security group, account, and KMS values before applying.

---
apiVersion: imagebuilder.io/v1alpha1
kind: VMImage
metadata:
  name: windows-2022-aws-remote
spec:
  os:
    family: windows
    distribution: windows-server
    version: "2022"
    arch: amd64

  source:
    type: cloud-image
    providerRef: ami-0123456789abcdef0

  provisioners:
    - type: powershell
      inline: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force -Path C:\ImageBuilder | Out-Null
        Set-Content -Path C:\ImageBuilder\build-info.txt -Value 'managed-by=imagebuilder'

    - type: file
      inline: |
        managed-by=imagebuilder
        os=windows-server-2022
        build-mode=remote
      args:
        - C:\ImageBuilder\metadata.txt

  targets:
    - providerConfigRef:
        name: aws-eu-west-1-windows
      format: ami
      tags:
        team: platform
        os: windows-server-2022
        build-mode: remote

  build:
    mode: remote
    timeout: 3h

---
apiVersion: imagebuilder.io/v1alpha1
kind: ProviderConfig
metadata:
  name: aws-eu-west-1-windows
spec:
  provider: aws
  region: eu-west-1
  extra:
    roleArn: arn:aws:iam::123456789012:role/ImageBuilderProviderRole
    remote.instanceType: t3.large
    remote.subnetId: subnet-0123456789abcdef0
    remote.securityGroupIds: sg-0123456789abcdef0
    remote.iamInstanceProfile: ImageBuilderInstanceProfile
    remote.kmsKeyId: alias/imagebuilder
    remote.rootVolumeSizeGiB: "80"

---
apiVersion: imagebuilder.io/v1alpha1
kind: PlatformProvider
metadata:
  name: aws
spec:
  package: ghcr.io/anwendt/imagebuilder-provider-aws@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  packagePullPolicy: IfNotPresent
  security:
    allowedRegistries:
      - ghcr.io/anwendt
    requireDigest: true
    verifySignature: true
