apiVersion: imagebuilder.io/v1alpha1
kind: VMImage
metadata:
  name: ubuntu-24-04-openstack
spec:
  os:
    family: linux
    distribution: ubuntu
    version: "24.04"
    arch: amd64
  source:
    type: cloud-image
    # For remote mode, providerRef is an existing Glance image UUID.
    providerRef: 00000000-0000-0000-0000-000000000000
  build:
    mode: remote
    timeout: 2h
  provisioners:
    - type: shell
      inline: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y qemu-guest-agent
  targets:
    - providerConfigRef:
        name: openstack-regionone
      format: qcow2
---
apiVersion: imagebuilder.io/v1alpha1
kind: ProviderConfig
metadata:
  name: openstack-regionone
spec:
  provider: openstack
  endpoint: https://openstack.example.com:5000/v3
  region: RegionOne
  credentials:
    secretRef:
      name: openstack-credentials
      key: credentials
  extra:
    remote.flavorRef: m1.small
    remote.networkID: 11111111-1111-1111-1111-111111111111
    remote.securityGroups: imagebuilder-build
    remote.keyName: imagebuilder-builder
    remote.sshUser: ubuntu
    image.visibility: private
---
apiVersion: imagebuilder.io/v1alpha1
kind: PlatformProvider
metadata:
  name: openstack
spec:
  package: ghcr.io/anwendt/imagebuilder-provider-openstack@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  packagePullPolicy: IfNotPresent
  transport:
    tls:
      mode: Mutual
      serverName: provider-openstack.imagebuilder-system.svc
      caSecretRef:
        name: provider-grpc-ca
        namespace: imagebuilder-system
      clientCertificateSecretRef:
        name: operator-provider-client-tls
        namespace: imagebuilder-system
      serverCertificateSecretRef:
        name: provider-openstack-server-tls
        namespace: imagebuilder-system
