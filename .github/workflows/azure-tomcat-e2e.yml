name: Azure Tomcat E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  azure-tomcat-e2e:
    name: Azure Tomcat Remote Build E2E
    runs-on: ubuntu-latest
    environment: azure-e2e
    timeout-minutes: 120
    env:
      AZURE_E2E_SUBSCRIPTION_ID: ${{ secrets.AZURE_E2E_SUBSCRIPTION_ID }}
      AZURE_E2E_TENANT_ID: ${{ secrets.AZURE_E2E_TENANT_ID }}
      AZURE_E2E_CLIENT_ID: ${{ secrets.AZURE_E2E_CLIENT_ID }}
      AZURE_E2E_CLIENT_SECRET: ${{ secrets.AZURE_E2E_CLIENT_SECRET }}
      AZURE_E2E_RESOURCE_GROUP: ${{ vars.AZURE_E2E_RESOURCE_GROUP }}
      AZURE_E2E_LOCATION: ${{ vars.AZURE_E2E_LOCATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare Azure E2E resources
        run: make test-e2e-azure-tomcat-prep

      - name: Run Azure Tomcat E2E and cleanup
        run: make test-e2e-azure-tomcat-run-clean

      - name: Cleanup Azure E2E resources
        if: always()
        run: make test-e2e-azure-tomcat-cleanup
