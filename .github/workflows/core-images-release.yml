name: Core Images Release

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        default: dev
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  OPERATOR_IMAGE: ${{ github.repository_owner }}/imagebuilder-operator
  BUILDER_IMAGE: ${{ github.repository_owner }}/imagebuilder-builder
  UPLOADER_IMAGE: ${{ github.repository_owner }}/imagebuilder-uploader

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Build, Push, Sign
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Resolve tag
        id: meta
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_IMAGE_TAG}"
          fi
          if [[ ! "${tag}" =~ ^v?[0-9]+(\.[0-9]+){1,2}([-+][0-9A-Za-z.-]+)?$ && "${tag}" != "dev" ]]; then
            echo "invalid image tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push operator image
        id: operator
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}:${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push builder image
        id: builder
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: Dockerfile.builder
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE }}:${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push uploader image
        id: uploader
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: Dockerfile.uploader
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.UPLOADER_IMAGE }}:${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign core images
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ steps.operator.outputs.digest }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE }}@${{ steps.builder.outputs.digest }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.UPLOADER_IMAGE }}@${{ steps.uploader.outputs.digest }}

      - name: Publish digest summary
        run: |
          echo "Operator image: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ steps.operator.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Builder image: ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE }}@${{ steps.builder.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Uploader image: ${{ env.REGISTRY }}/${{ env.UPLOADER_IMAGE }}@${{ steps.uploader.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Set Helm image.digest, builderImage.digest, and uploaderImage.digest to these values." >> "$GITHUB_STEP_SUMMARY"
