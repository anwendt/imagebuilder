name: Core Images Release

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        default: dev
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  OPERATOR_IMAGE: ${{ github.repository_owner }}/imagebuilder-operator
  BUILDER_IMAGE: ${{ github.repository_owner }}/imagebuilder-builder
  UPLOADER_IMAGE: ${{ github.repository_owner }}/imagebuilder-uploader
  PROVISIONER_ANSIBLE_IMAGE: ${{ github.repository_owner }}/imagebuilder-provisioner-ansible
  PROVISIONER_CHEF_IMAGE: ${{ github.repository_owner }}/imagebuilder-provisioner-chef
  PROVISIONER_CUSTOM_IMAGE: ${{ github.repository_owner }}/imagebuilder-provisioner-custom
  PROVISIONER_PUPPET_IMAGE: ${{ github.repository_owner }}/imagebuilder-provisioner-puppet
  PROVISIONER_SALTSTACK_IMAGE: ${{ github.repository_owner }}/imagebuilder-provisioner-saltstack

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Build, Push, Sign
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Resolve tag
        id: meta
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_IMAGE_TAG}"
          fi
          if [[ ! "${tag}" =~ ^v?[0-9]+(\.[0-9]+){1,2}([-+][0-9A-Za-z.-]+)?$ && "${tag}" != "dev" ]]; then
            echo "invalid image tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push operator image
        id: operator
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}:${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push builder image
        id: builder
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.builder
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE }}:${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push uploader image
        id: uploader
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.uploader
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.UPLOADER_IMAGE }}:${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Ansible provisioner image
        id: provisioner_ansible
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.provisioner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROVISIONER_ANSIBLE_IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: PROVISIONER_TYPE=ansible
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Chef provisioner image
        id: provisioner_chef
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.provisioner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROVISIONER_CHEF_IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: PROVISIONER_TYPE=chef
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Puppet provisioner image
        id: provisioner_puppet
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.provisioner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROVISIONER_PUPPET_IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: PROVISIONER_TYPE=puppet
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Custom provisioner image
        id: provisioner_custom
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.provisioner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROVISIONER_CUSTOM_IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: PROVISIONER_TYPE=custom
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push SaltStack provisioner image
        id: provisioner_saltstack
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.provisioner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROVISIONER_SALTSTACK_IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: PROVISIONER_TYPE=saltstack
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003

      - name: Sign core images
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ steps.operator.outputs.digest }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE }}@${{ steps.builder.outputs.digest }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.UPLOADER_IMAGE }}@${{ steps.uploader.outputs.digest }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.PROVISIONER_ANSIBLE_IMAGE }}@${{ steps.provisioner_ansible.outputs.digest }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.PROVISIONER_CHEF_IMAGE }}@${{ steps.provisioner_chef.outputs.digest }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.PROVISIONER_CUSTOM_IMAGE }}@${{ steps.provisioner_custom.outputs.digest }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.PROVISIONER_PUPPET_IMAGE }}@${{ steps.provisioner_puppet.outputs.digest }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.PROVISIONER_SALTSTACK_IMAGE }}@${{ steps.provisioner_saltstack.outputs.digest }}

      - name: Publish digest summary
        run: |
          echo "Operator image: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}@${{ steps.operator.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Builder image: ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE }}@${{ steps.builder.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Uploader image: ${{ env.REGISTRY }}/${{ env.UPLOADER_IMAGE }}@${{ steps.uploader.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ansible provisioner image: ${{ env.REGISTRY }}/${{ env.PROVISIONER_ANSIBLE_IMAGE }}@${{ steps.provisioner_ansible.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Chef provisioner image: ${{ env.REGISTRY }}/${{ env.PROVISIONER_CHEF_IMAGE }}@${{ steps.provisioner_chef.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Custom provisioner image: ${{ env.REGISTRY }}/${{ env.PROVISIONER_CUSTOM_IMAGE }}@${{ steps.provisioner_custom.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Puppet provisioner image: ${{ env.REGISTRY }}/${{ env.PROVISIONER_PUPPET_IMAGE }}@${{ steps.provisioner_puppet.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "SaltStack provisioner image: ${{ env.REGISTRY }}/${{ env.PROVISIONER_SALTSTACK_IMAGE }}@${{ steps.provisioner_saltstack.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Set Helm image.digest, builderImage.digest, uploaderImage.digest, and provisionerImages.*.digest to these values." >> "$GITHUB_STEP_SUMMARY"
