name: OpenStack Provider Image Release

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        default: dev
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/imagebuilder-provider-openstack

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Build, Push, Sign
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Resolve tag
        id: meta
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_IMAGE_TAG}"
          fi
          if [[ ! "${tag}" =~ ^v?[0-9]+(\.[0-9]+){1,2}([-+][0-9A-Za-z.-]+)?$ && "${tag}" != "dev" ]]; then
            echo "invalid image tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push OpenStack provider image
        id: build
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: Dockerfile.provider-openstack
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign OpenStack provider image
        env:
          COSIGN_YES: "true"
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Publish digest summary
        run: |
          echo "OpenStack Provider image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Use OPENSTACK_PROVIDER_DIGEST=${{ steps.build.outputs.digest }} make update-openstack-provider-samples" >> "$GITHUB_STEP_SUMMARY"
