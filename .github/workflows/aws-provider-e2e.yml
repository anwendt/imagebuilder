name: AWS Provider E2E

on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region
        required: true
      source_ami:
        description: Source AMI ID. Use an SSM-ready Windows AMI when os_family=windows.
        required: true
      os_family:
        description: linux or windows
        required: true
        default: linux
        type: choice
        options:
          - linux
          - windows
      subnet_id:
        description: Subnet ID
        required: true
      security_group_ids:
        description: Comma-separated security group IDs
        required: true
      instance_profile:
        description: Build instance profile name
        required: true
      kms_key_id:
        description: KMS key ID or alias
        required: true
      role_arn:
        description: Role ARN for GitHub OIDC and provider AWS calls
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  e2e:
    name: Real AWS Remote Build
    runs-on: ubuntu-latest
    environment: aws-e2e
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.region }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run AWS provider E2E
        env:
          AWS_E2E: "1"
          AWS_E2E_REGION: ${{ inputs.region }}
          AWS_E2E_SOURCE_AMI: ${{ inputs.source_ami }}
          AWS_E2E_OS_FAMILY: ${{ inputs.os_family }}
          AWS_E2E_SUBNET_ID: ${{ inputs.subnet_id }}
          AWS_E2E_SECURITY_GROUP_IDS: ${{ inputs.security_group_ids }}
          AWS_E2E_INSTANCE_PROFILE: ${{ inputs.instance_profile }}
          AWS_E2E_KMS_KEY_ID: ${{ inputs.kms_key_id }}
          AWS_E2E_ROLE_ARN: ${{ inputs.role_arn }}
        run: make test-e2e-aws
