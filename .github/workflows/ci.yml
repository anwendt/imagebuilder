name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/operator

permissions:
  contents: read

jobs:
  test:
    name: Unit, Core E2E, Manifest Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Run full Go test suite
        run: go test ./... -count=1

      - name: Verify Go module integrity
        run: make verify-deps

      - name: Run deterministic core E2E tests
        run: make test-core-e2e

      - name: Validate deployment and Helm invariants
        run: make test-manifests

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all binaries
        run: |
          make build
          make build-builder
          make build-uploader
          make build-provider-aws
          make build-provider-vsphere
          make build-provider-azure
          make build-provider-openstack

  vsphere-simulator:
    name: vSphere Provider Simulator
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govmomi simulator integration test
        run: make test-vsphere-simulator

  generated:
    name: Generated Artifacts Are Current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Install protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Regenerate code and manifests
        run: |
          make generate
          make manifests
          make proto

      - name: Fail on uncommitted generated changes
        run: |
          git diff --exit-code -- api config

  security:
    name: Required Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: make vet

      - name: staticcheck
        run: make staticcheck

      - name: gosec
        run: make gosec

      - name: govulncheck
        run: make govulncheck

      - name: license check
        run: make license-check

  gosec-sarif:
    name: Upload gosec SARIF
    runs-on: ubuntu-latest
    needs: security
    if: always() && github.event_name != 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Run gosec SARIF
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.22.10 \
            -exclude-generated \
            -fmt sarif \
            -out gosec.sarif \
            -severity high \
            $(go list -f '{{.Dir}}' ./... | grep -v '/templates/')

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        if: always() && hashFiles('gosec.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: gosec.sarif

  secrets:
    name: Secret Scan / gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Run gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect --source . --redact --verbose

  helm:
    name: Helm Chart Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2

      - name: Lint chart
        run: make helm-lint

      - name: Render chart
        run: make helm-template

  image-scan:
    name: Container Image Scan / Trivy
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build operator image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build builder image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.builder
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/imagebuilder-builder:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner for builder
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/imagebuilder-builder:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build uploader image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.uploader
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/imagebuilder-uploader:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner for uploader
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/imagebuilder-uploader:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build AWS provider image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.provider-aws
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-aws:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner for AWS provider
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-aws:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build vSphere provider image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.provider-vsphere
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-vsphere:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner for vSphere provider
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-vsphere:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build Azure provider image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.provider-azure
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-azure:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner for Azure provider
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-azure:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build OpenStack provider image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.provider-openstack
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-openstack:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner for OpenStack provider
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-openstack:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  image-scan-sarif:
    name: Upload Container Image SARIF
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build operator image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Build builder image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.builder
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/imagebuilder-builder:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner for builder
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/imagebuilder-builder:ci
          format: sarif
          output: trivy-builder-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload builder Trivy SARIF
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        if: always() && hashFiles('trivy-builder-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-builder-results.sarif

      - name: Build uploader image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.uploader
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/imagebuilder-uploader:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner for uploader
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/imagebuilder-uploader:ci
          format: sarif
          output: trivy-uploader-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload uploader Trivy SARIF
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        if: always() && hashFiles('trivy-uploader-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-uploader-results.sarif

      - name: Build AWS provider image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.provider-aws
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-aws:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner for AWS provider
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-aws:ci
          format: sarif
          output: trivy-aws-provider-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload AWS provider Trivy SARIF
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        if: always() && hashFiles('trivy-aws-provider-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-aws-provider-results.sarif

      - name: Build vSphere provider image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.provider-vsphere
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-vsphere:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner for vSphere provider
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-vsphere:ci
          format: sarif
          output: trivy-vsphere-provider-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload vSphere provider Trivy SARIF
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        if: always() && hashFiles('trivy-vsphere-provider-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-vsphere-provider-results.sarif

      - name: Build Azure provider image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.provider-azure
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-azure:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner for Azure provider
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-azure:ci
          format: sarif
          output: trivy-azure-provider-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Azure provider Trivy SARIF
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        if: always() && hashFiles('trivy-azure-provider-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-azure-provider-results.sarif

      - name: Build OpenStack provider image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile.provider-openstack
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-openstack:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner for OpenStack provider
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/imagebuilder-provider-openstack:ci
          format: sarif
          output: trivy-openstack-provider-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload OpenStack provider Trivy SARIF
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        if: always() && hashFiles('trivy-openstack-provider-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-openstack-provider-results.sarif

  required:
    name: Required CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - test
      - build
      - vsphere-simulator
      - generated
      - security
      - secrets
      - helm
      - image-scan
    steps:
      - name: All required gates passed
        run: echo "All required CI gates passed."
