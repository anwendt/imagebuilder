name: Operator Image Release

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Operator image tag to publish
        required: true
        default: dev

env:
  REGISTRY: ghcr.io
  OPERATOR_IMAGE: ${{ github.repository_owner }}/imagebuilder-operator

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Build, Push, Sign Operator
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Validate tag
        id: meta
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [[ ! "${INPUT_IMAGE_TAG}" =~ ^v?[0-9]+(\.[0-9]+){1,2}([-+][0-9A-Za-z.-]+)?$ && "${INPUT_IMAGE_TAG}" != "dev" ]]; then
            echo "invalid image tag: ${INPUT_IMAGE_TAG}" >&2
            exit 1
          fi
          echo "tag=${INPUT_IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push operator image
        id: operator
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}:${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003

      - name: Sign operator image
        env:
          COSIGN_YES: "true"
        run: cosign sign --yes "${REGISTRY}/${OPERATOR_IMAGE}@${{ steps.operator.outputs.digest }}"

      - name: Publish digest summary
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: echo "Operator image ${REGISTRY}/${OPERATOR_IMAGE}:${IMAGE_TAG}@${{ steps.operator.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
